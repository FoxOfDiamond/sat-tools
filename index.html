<!DOCTYPE html>

<style>
    .answer-explanation {
        opacity: 0;
    }

    .answer-explanation.show {
        opacity: 1;
    }

    .question table {
        border: 1px solid;
    }

    .question table tr th {
        border: 1px solid;
        padding-left: 10px;
        padding-right: 10px;
    }

    .question table tr td {
        border: 1px solid;
        padding-left: 10px;
        padding-right: 10px;
    }

    .question ul {
        list-style: disc;
        padding-left: 40px;
        margin-top: 16px;
        margin-bottom: 16px;
    }

    .question ol {
        padding-left: 40px;
        margin-top: 16px;
        margin-bottom: 16px;
    }
</style>

<input type="text" id="lookup-input"> <button id="lookup-enter">Lookup</button>
<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<script>
    const button = document.getElementById("lookup-enter")
    const textbox = document.getElementById("lookup-input")
    button.addEventListener("click",()=>{
        let id = textbox.value
        $(function(){
            $.getJSON('data/cb-digital-questions.json',function(data) {
                $.each(data,function(key,value){
                    if (value.questionId == id){
                        console.log(value);
                    }
                })
            })
        })
    })
</script>
