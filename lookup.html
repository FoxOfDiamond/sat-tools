<body style="margin: 20px;">
    <input type="text" id="lookup-input"> <button style="width:100px;" id="lookup-enter">Lookup</button>
    <div id="placeholder"></div>
    <template id="template">
        <div style="width: 100%; height: 100%;">
            <div>Question ID: <span id="id"></span></div>
            <div>Test: <span id="module"></span></div>
            <div>Domain: <span id="class"></span></div>
            <div>Skill: <span id="skill"></span></div>
            <div>Difficulty: <span id="difficulty"></span></div><br>
            <div id="prompt"></div>
            <br>

            <div style="display:grid;grid-template-columns: 35px 100%; row-gap: 10px;">
                <button id="option-a" style="width: 30px; height: 30px; border-radius: 100%;">A.</button>
                <div id="option-a-inner"></div>
                <button id="option-b" style="width: 30px; height: 30px; border-radius: 100%;">B.</button>
                <div id="option-b-inner"></div>
                <button id="option-c" style="width: 30px; height: 30px; border-radius: 100%;">C.</button>
                <div id="option-c-inner"></div>
                <button id="option-d" style="width: 30px; height: 30px; border-radius: 100%;">D.</button>
                <div id="option-d-inner"></div>
            </div> <br>

            <input type="text" id="submit-field"></input>
            <button id="submit-button" style="width:100px;">Submit</button>

            <div id="answer">Correct answer: <span id="answer-inner"></span></div><br>
            <div id="rationale">Rationale: </div>
            <div id="rationale-inner"></div>
        </div>
    </template>
</body>



<script>
    const button = document.getElementById("lookup-enter")
    const textbox = document.getElementById("lookup-input")
    const placeholder = document.getElementById("placeholder")
    const template = document.getElementById("template")
    button.addEventListener("click", async () => {
        let id = textbox.value
        let found = false;
        await fetch("data/cb-digital-questions.json")
            .then(response => {return response.json()})
            .then(data => {
                for (let key in data){
                    let value = data[key]
                    if (value.questionId == id) {
                        console.log(value);
                        displayQuestion(value);
                        found = true;
                    }
                }
            })
        if (!found){
            placeholder.innerHTML = "Question not found";
        }
    })

    function displayQuestion(data) {
        console.log(data)

        let isMcq = data.content.answer ? (data.content.answer.style == "Multiple Choice") : (data.content.type == "mcq")
        placeholder.innerHTML = template.innerHTML;
        placeholder.querySelector("#id").innerHTML = data.questionId
        placeholder.querySelector("#module").innerHTML = data.module.slice(0, 1).toUpperCase() + data.module.slice(1)
        placeholder.querySelector("#class").innerHTML = data.primary_class_cd_desc
        placeholder.querySelector("#skill").innerHTML = data.skill_desc
        placeholder.querySelector("#difficulty").innerHTML = {
            "H": "Hard",
            "M": "Medium",
            "E": "Easy"
        } [data.difficulty]
        placeholder.querySelector("#prompt").innerHTML = data.content.answer ? ((data.content.body || "") + data.content.prompt) : ((data.content.stimulus || "") + data.content.stem)
        if (isMcq) {
            placeholder.querySelector("#submit-button").remove()
            placeholder.querySelector("#submit-field").remove()

            placeholder.querySelector("#option-a-inner").innerHTML = data.content.answer ? (data.content.answer.choices.a.body) : (data.content.answerOptions[0].content)
            placeholder.querySelector("#option-b-inner").innerHTML = data.content.answer ? (data.content.answer.choices.b.body) : (data.content.answerOptions[1].content)
            placeholder.querySelector("#option-c-inner").innerHTML = data.content.answer ? (data.content.answer.choices.c.body) : (data.content.answerOptions[2].content)
            placeholder.querySelector("#option-d-inner").innerHTML = data.content.answer ? (data.content.answer.choices.d.body) : (data.content.answerOptions[3].content)

            placeholder.querySelector("#option-a").addEventListener("click", revealAnswer)
            placeholder.querySelector("#option-b").addEventListener("click", revealAnswer)
            placeholder.querySelector("#option-c").addEventListener("click", revealAnswer)
            placeholder.querySelector("#option-d").addEventListener("click", revealAnswer)
        } else {
            placeholder.querySelector("#option-a").remove()
            placeholder.querySelector("#option-b").remove()
            placeholder.querySelector("#option-c").remove()
            placeholder.querySelector("#option-d").remove()

            placeholder.querySelector("#submit-button").addEventListener("click", revealAnswer)
        }
        placeholder.querySelector("#rationale").setAttribute("hidden", true)
        placeholder.querySelector("#answer").setAttribute("hidden", true)

        function revealAnswer() {
            placeholder.querySelector("#rationale").removeAttribute("hidden")
            placeholder.querySelector("#answer").removeAttribute("hidden")

            placeholder.querySelector("#rationale-inner").innerHTML = data.content.answer ? data.content.answer.rationale : data.content.rationale
            placeholder.querySelector("#answer-inner").innerHTML = data.content.answer ? (isMcq ? data.content.answer.correct_choice.toUpperCase() : "") : (data.content.correct_answer.join(" or "))

        }
    }
</script>
